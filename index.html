<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교대 캘린더</title>
<!-- ===== PWA — manifest는 단일 파일 유지를 위해 JS에서 data URI로 생성 ===== -->
<link rel="manifest" id="manifestLink">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" id="appleTouchIcon">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1d24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="교대캘린더">
<style>
  /* 교대 색 (ABC 작은 표시용) */
  :root{
    --cA:#e69100; --cB:#2b6cb0; --cC:#6b3fa0; --cOFF:#555;
    --holiday:#dc2626; --alt:#b45309;
    --star-gold:#b8860b; --star-bridge:#c0392b;
  }
  /* 주간(밝게) 모드 - 무채색 캘린더 */
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --ink:#1f2937;
    --ink2:#4b5563;
    --ink3:#9ca3af;
    --border:#e5e7eb;
    --grid-line:#f1f3f6;
    --cell-alt:#fafbfc;
    --cell-off:#f8f9fb;
    --tab-bg:#ffffff;
    --tab-ink:#4b5563;
    --tab-active:#374151;
    --today-ring:#0ea5e9;
    --weekend-sun:#c0392b;
    --weekend-sat:#2b6cb0;
  }
  /* 야간(어둡게) 모드 */
  .dark{
    --bg:#1a1d24;
    --card:#22262e;
    --ink:#e5e7eb;
    --ink2:#9ca3af;
    --ink3:#6b7280;
    --border:#374151;
    --grid-line:#2d313a;
    --cell-alt:#262b33;
    --cell-off:#23272e;
    --tab-bg:#22262e;
    --tab-ink:#9ca3af;
    --tab-active:#e5e7eb;
    --today-ring:#38bdf8;
    --weekend-sun:#f87171;
    --weekend-sat:#60a5fa;
    --holiday:#f87171;
    --alt:#fbbf24;
    --star-gold:#fbbf24;
    --star-bridge:#f87171;
  }
  *{box-sizing:border-box; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
  body{margin:0; padding:8px 12px; background:var(--bg); color:var(--ink); transition:background .2s,color .2s;}
  h1{font-size:24px; margin:0 0 8px; font-weight:900; letter-spacing:-0.5px;}
  .sub{color:var(--ink2); font-size:13px; margin-bottom:14px;}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; justify-content:space-between;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .nav-group{display:flex; align-items:center; gap:10px;}
  /* 연도 화살표 — 월 화살표와 같은 모양, 배경·테두리 없음 (색 없는 아이콘) */
  .nav-btn.year-btn{background:transparent; border:0; color:var(--ink3);}
  .nav-btn.year-btn:hover{background:var(--cell-alt);}
  .nav-btn{background:var(--card); border:1px solid var(--border); border-radius:8px; width:30px; height:28px; font-size:14px; cursor:pointer; color:var(--ink); transition:background .12s; line-height:1;}
  .nav-btn:hover{background:var(--cell-alt);}
  .month-label{font-size:16px; font-weight:800; color:var(--ink);}
  .legend{display:flex; flex-wrap:wrap; gap:5px; font-size:11px;}
  .legend .item{display:flex; align-items:center; gap:5px; background:var(--card); padding:3px 8px; border-radius:7px; border:1px solid var(--border); color:var(--ink2);}
  .swatch{width:14px; height:14px; border-radius:4px; display:inline-block;}
  .star{color:var(--star-gold); font-weight:700;}
  .star.b{color:var(--star-bridge);}
  .cal-wrap{display:grid; grid-template-columns:1fr 260px; gap:10px; align-items:start;}
  @media(max-width:1000px){.cal-wrap{grid-template-columns:1fr;}}
  .month-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px; box-shadow:0 1px 3px rgba(0,0,0,.04); transition:background .2s,border-color .2s;}
  table{width:100%; border-collapse:collapse; table-layout:fixed; position:relative;}
  th{font-size:11px; color:var(--ink2); padding:3px 0; font-weight:600;}
  th.sun{color:var(--weekend-sun);} th.sat{color:var(--weekend-sat);}
  /* 주차 열 (ISO 8601: 월~일 기준) */
  th.wk-h, td.wk{width:30px;}
  td.wk{font-size:10px; font-weight:700; color:var(--ink3); text-align:center; vertical-align:middle; background:var(--cell-off); border:1px solid var(--grid-line); cursor:default;}
  /* 셀 높이: 한 화면에 달력이 차도록 뷰포트 기반 계산
     (한 달 최대 6주 = 헤더 제외 나머지 공간을 6등분) */
  /* 일자 칸 세로: JS가 화면 높이 기준으로 --cell-h 설정 (요일 th 행은 영향 없음)
     .cell-inner 절대배치 — 배지·메모가 많아도 셀 높이 고정 → 캘린더가 늘어나지 않음 */
  td{vertical-align:top; border:1px solid var(--grid-line); padding:0; height:var(--cell-h, 100px); min-height:80px; overflow:hidden; position:relative; transition:background .15s; box-sizing:border-box;}
  td[data-d]{cursor:pointer;}
  td[data-d]:hover{background:var(--cell-alt);}
  /* 공휴일/대체공휴일 — 점선 제거 */
  td.hol-cell{border:1px solid var(--grid-line);}
  .date-row{display:flex; align-items:center; gap:6px; padding:5px 7px 0;}
  /* 셀 내용 절대배치 래퍼 — 콘텐츠 높이가 셀 행 높이 계산에서 완전 분리 */
  .cell-inner{position:absolute; inset:0; z-index:2;}
  .date{font-size:16px; font-weight:800; color:var(--ink);}
  .date.sun{color:var(--weekend-sun);} .date.sat{color:var(--weekend-sat);}
  .shift-dot{font-size:12px; font-weight:800; color:#fff; border-radius:4px; padding:2px 7px; line-height:1.3; letter-spacing:0;}
  .shift-dot.A{background:var(--cA);}
  .shift-dot.B{background:var(--cB);}
  .shift-dot.C{background:var(--cC);}
  .shift-dot.OFF{background:var(--cOFF);}
  .dayn{font-size:10px; color:var(--ink3); padding:2px 7px 0; font-weight:600;}
  /* 셀 내 배지 공통 규격 — 종류 불문 동일 폰트·패딩·정렬 */
  .cell-badge{display:block; width:fit-content; width:-moz-fit-content; font-size:10px; font-weight:800; line-height:1; padding:4px 7px; margin:3px 7px 0; color:#fff; border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:calc(100% - 14px);}
  /* 공휴일: 채워진 글자박스 (연차 배지 스타일), 대체공휴일: 일자만 빨간색 */
  .hol{background:var(--holiday);}
  /* 급여 기준월 경계 (마감=회색, 시작=파란색) */
  .pay-mark{background:#2b6cb0;}
  .pay-mark.end{background:#475569;}
  .pay-mark.pay{background:#b45309;}
  .ann-end{background:#7c3aed;}
  /* 대체공휴일: 배경 없이 주황 글자 */
  .hol.alt{background:transparent; color:var(--alt);}
  .empty{background:var(--cell-off);}
  .off-cell{background:var(--cell-off);}
  .other{opacity:.42;}
  .other .date{font-weight:600;}
  .today{box-shadow:inset 0 0 0 2px var(--today-ring);}
  /* 휴가 표시 - 연속 박스로만 표현 (개별 테두리 제거) */
  td.has-leave{box-shadow:none;}
  /* 연속 구간 박스 */
  .group-box{position:absolute; pointer-events:none; border:2px solid #ef4444; border-radius:8px; z-index:1;}
  .group-box.auto{border-color:var(--star-gold); border-style:dashed;}
  .side{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; box-shadow:0 1px 3px rgba(0,0,0,.04); transition:background .2s,border-color .2s;}
  .side h3{font-size:13px; margin:0 0 4px; color:var(--ink);}
  .side .hint{font-size:11px; color:var(--ink3); margin-bottom:12px;}
  .opp{border-top:1px solid var(--grid-line); padding:10px 0; font-size:12px;}
  .opp:first-of-type{border-top:0;}
  .none{color:var(--ink3); font-size:12px; font-style:italic;}
  /* ===== 예정 휴가 리스트 ===== */
  .up-list{margin-top:12px;}
  .up-list h3{font-size:13px; margin:0 0 6px; color:var(--ink);}
  .up-row{display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:7px; font-size:12px; margin-bottom:4px; background:var(--cell-alt); border:1px solid var(--grid-line);}
  .up-row .up-date{font-weight:800; color:var(--ink); min-width:72px; font-variant-numeric:tabular-nums;}
  .up-row .up-d{font-weight:800; color:var(--ink); min-width:16px;}
  .up-row .up-tag{font-size:11px; font-weight:700; padding:3px 8px; border-radius:5px; color:#fff; white-space:nowrap;}
  .up-row .up-memo{color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; font-size:11px;}
  .up-row .up-dday{font-size:11px; font-weight:800; color:var(--card); padding:3px 8px; border-radius:5px; margin-left:auto; white-space:nowrap;}
  .up-row .up-dday.soon{background:var(--star-bridge);}
  .up-row .up-dday.far{background:var(--tab-active); color:var(--card);}
  .info{margin-top:18px; font-size:11px; color:var(--ink2); max-width:760px; line-height:1.6;}
  /* ===== 휴가 보유량 블록 (캘린더 위, 2단 그리드) ===== */
  .quota-block{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.04); transition:background .2s,border-color .2s;}
  .quota-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:7px;}
  .q-item{display:flex; align-items:center; gap:9px; background:var(--cell-alt); border:1px solid var(--border); border-left:5px solid var(--qc,#999); border-radius:8px; padding:9px 12px;}
  .q-item .q-nm{font-size:14px; font-weight:800; min-width:64px;}
  .q-item .q-total{width:42px; background:var(--card); border:1px solid var(--border); color:var(--ink); text-align:center; border-radius:6px; font-size:14px; font-weight:700; padding:4px 0;}
  .q-item .q-nums{font-size:14px; color:var(--ink2); font-variant-numeric:tabular-nums;}
  .q-item .q-nums b{color:var(--ink); font-weight:900; font-size:15px;}
  .q-item .q-nums .u{color:var(--star-bridge); font-weight:800;}
  .q-item .q-nums .low{color:var(--star-bridge); font-weight:900;}
  .q-item .q-nums .mid{color:var(--alt); font-weight:800;}
  .quota-sum{margin-top:6px; padding-top:5px; border-top:1px solid var(--grid-line); font-size:13px; font-weight:700; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .quota-sum b{color:var(--ink);}
  .quota-sum .warn{color:var(--star-bridge);}
  /* 휴가 현황판 */
  .leave-box{margin-bottom:16px;}
  .leave-box h3{font-size:13px; margin:0 0 8px; color:var(--ink);}
  .leave-row{display:grid; grid-template-columns:64px 1fr; gap:6px; align-items:center; margin-bottom:7px; font-size:11px;}
  .leave-row .nm{font-weight:700; color:var(--ink);}
  .leave-row .stats{display:flex; gap:4px; align-items:center;}
  .leave-row .tot{width:46px; background:var(--cell-alt); border:1px solid var(--border); color:var(--ink); text-align:center; border-radius:5px; font-size:11px; padding:2px 0;}
  .leave-row .used{color:var(--star-bridge); font-weight:700; min-width:42px;}
  .leave-row .rem{color:var(--ink2);}
  .leave-row .bar{flex:1; height:6px; background:var(--cell-alt); border-radius:3px; overflow:hidden; border:1px solid var(--border);}
  .leave-row .bar > span{display:block; height:100%; background:var(--star-bridge);}
  .leave-sum{margin-top:8px; padding-top:8px; border-top:1px solid var(--grid-line); font-size:11px; color:var(--ink2);}
  /* 필터 */
  .filter-row{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px;}
  .fchip{font-size:10px; font-weight:700; padding:3px 9px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--ink2); cursor:pointer;}
  .fchip.on{background:var(--tab-active); color:var(--card); border-color:var(--tab-active);}
  /* 휴가 입력 표시 — 색상만 정의 (셀 내 크기·정렬은 .cell-badge 공통 규격) */
  .lv-mark{font-size:12px; font-weight:800; padding:2px 8px; border-radius:5px; color:#fff; line-height:1.35;}
  .lv-mark.ANNUAL{background:#dc2626;}
  .lv-mark.YEAR{background:#7c3aed;}
  .lv-mark.NIGHT{background:#0ea5e9;}
  .lv-mark.SHIFT{background:#16a34a;}
  .lv-mark.EX{background:#64748b;}
  .lv-mark.OT{background:#ea580c;}
  .lv-mark.EARLY{background:#0d9488;}
  .lv-mark.EDU{background:#9333ea;}
  .lv-memo{font-size:11px; color:var(--ink2); padding:1px 7px 0; line-height:1.25; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;}
  /* 모달 */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:50;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; width:320px; max-width:92vw; box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 6px; font-size:15px; color:var(--ink);}
  .modal .mdate{font-size:12px; color:var(--ink2); margin-bottom:14px;}
  .modal label{display:block; font-size:11px; font-weight:700; color:var(--ink2); margin:10px 0 4px;}
  .modal select,.modal input[type=text]{width:100%; background:var(--cell-alt); border:1px solid var(--border); color:var(--ink); border-radius:7px; padding:7px 9px; font-size:13px; font-family:inherit;}
  .seg{display:flex; gap:5px;}
  .seg button{flex:1; background:var(--cell-alt); border:1px solid var(--border); color:var(--ink); border-radius:7px; padding:6px 0; font-size:12px; font-weight:700; cursor:pointer;}
  .seg button.on{background:var(--tab-active); color:var(--card); border-color:var(--tab-active);}
  .modal .btns{display:flex; gap:8px; margin-top:16px;}
  .modal .btns button{flex:1; padding:9px 0; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:0;}
  .btn-save{background:#2563eb; color:#fff;}
  .btn-del{background:var(--cell-alt); color:var(--ink2); border:1px solid var(--border)!important;}
  .btn-cancel{background:var(--cell-alt); color:var(--ink2); border:1px solid var(--border)!important;}
  .modal .memo-row{margin-top:4px;}
  .hol-add{width:100%; margin-top:10px; background:var(--cell-alt); border:1px dashed var(--holiday); color:var(--holiday); padding:8px 0; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; transition:all .12s;}
  .hol-add:hover{background:var(--holiday); color:#fff;}
  .hol-add.on{background:var(--holiday); color:#fff; border-style:solid;}
  .hol-add:disabled{opacity:.45; cursor:not-allowed;}
  .hol-add:disabled:hover{background:var(--cell-alt); color:var(--holiday);}
  .edit-icon{cursor:pointer; opacity:.6; font-size:10px; color:var(--ink2); margin-left:4px;}
  .edit-icon:hover{opacity:1;}
  .toolbar-right{display:flex; align-items:center; gap:8px;}
  .ex-toggle{background:var(--card); border:1.5px solid var(--border); color:var(--ink); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:700; transition:all .15s; display:flex; align-items:center; gap:6px;}
  .ex-toggle:hover{background:var(--cell-alt);}
  .ex-toggle.on{background:#dc2626; color:#fff; border-color:#dc2626;}
  .ex-toggle .dot{width:9px; height:9px; border-radius:50%; background:#94a3b8; transition:background .15s;}
  .ex-toggle.on .dot{background:#fff;}
  .print{background:var(--tab-active); color:var(--card); border:0; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:12px;}
  .theme-btn{background:var(--card); border:1px solid var(--border); color:var(--ink); padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;}
  .theme-btn:hover{background:var(--cell-alt);}
  /* ===== 모바일 최적화 (768px 이하) ===== */
  @media(max-width:768px){
    body{padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
    h1{font-size:20px;}
    .sub{font-size:12px;}
    /* 툴바: 시계 숨기고 버튼만 한 줄 */
    .toolbar-right{width:100%; justify-content:flex-end;}
    #clock{display:none;}
    .theme-btn,.print{padding:7px 10px; font-size:12px;}
    /* 보유량 카드: 1열 */
    .quota-grid{grid-template-columns:1fr; gap:5px;}
    .q-item{padding:7px 9px; gap:6px;}
    .q-item .q-nm{font-size:12px; min-width:56px;}
    .q-item .q-total{width:44px; font-size:12px; padding:5px 0;}
    .q-item .q-nums{font-size:11px;}
    .q-item .q-nums b{font-size:12px;}
    /* 캘린더: 주차 열 제거 → 7칸 확보 */
    th.wk-h, td.wk{display:none;}
    /* 달 헤더 — 연도 화살표 유지, 간격 축소 */
    .cal-head{gap:4px;}
    .nav-group{gap:6px;}
    .nav-btn{width:32px; height:30px;} /* 손가락 터치 최소 크기 */
    .month-label{font-size:15px;}
    /* 셀: 세로 공간 절약 */
    td{height:var(--cell-h, 64px); min-height:56px;}
    .date{font-size:13px;}
    .shift-dot{font-size:10px; padding:1px 4px; border-radius:3px;}
    .dayn{display:none;}
    .date-row{padding:3px 4px 0; gap:3px;}
    /* 배지: 작게, 잘림 방지(ellipsis 유지) */
    .cell-badge{font-size:9px; padding:3px 4px; margin:2px 4px 0; max-width:calc(100% - 8px); border-radius:4px;}
    .lv-memo{font-size:9px; padding:1px 4px 0;}
    /* 사이드 패널: 캘린더 아래로, 최대높이 해제 */
    .cal-wrap > div:last-child{max-height:none !important; overflow-y:visible !important;}
    .side{padding:9px;}
    /* 모달: 하단 시트 스타일 */
    .modal-bg{align-items:flex-end;}
    .modal{width:100%; max-width:100vw; border-radius:14px 14px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
    /* 예정 휴가 행 */
    .up-row{font-size:11px; padding:5px 6px;}
    .up-row .up-date{min-width:60px; font-size:11px;}
    .up-row .up-memo{display:none;} /* 좁은 화면에서 줄 넘침 방지 */
    /* 필터 칩 */
    .filter-row{gap:4px;}
    .fchip{font-size:9px; padding:3px 7px;}
    /* 범례: 두 줄 이상 접힘 */
    .legend{gap:4px;}
    .legend .item{font-size:10px; padding:2px 6px;}
  }
  @media print{.print,.theme-btn,.ex-toggle,.tabs{display:none;} .cal-wrap{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="toolbar">
  <div></div>
  <div class="toolbar-right">
    <span id="clock" style="font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;padding:5px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px;"></span>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 야간</button>
    <button class="theme-btn" onclick="exportData()" title="휴가·보유량을 JSON 파일로 저장 — 기기 이전용">📤 백업</button>
    <button class="theme-btn" onclick="document.getElementById('importFile').click()" title="백업 JSON 파일에서 데이터 복구">📥 복구</button>

// ===== 교대 패턴: A 6 · 휴2 · B 6 · 휴2 · C 6 · 휴2 (24일 주기) =====
const CYCLE = [
  "A","A","A","A","A","A","OFF","OFF",
  "B","B","B","B","B","B","OFF","OFF",
  "C","C","C","C","C","C","OFF","OFF"
];
const CYCLE_DAY = (function(){
  const arr=[]; let seq=[["A",6],["OFF",2],["B",6],["OFF",2],["C",6],["OFF",2]];
  for(const [k,n] of seq){ for(let i=1;i<=n;i++) arr.push(i+"일차"); }
  return arr;
})();
// 시작점: 3조 idx0(A1), 1조 idx8(B5), 2조 idx16(C3), 4조 idx6(휴1)
const TEAM_OFFSET = {"3조":0,"1조":12,"2조":20,"4조":6};
const ANCHOR = new Date(2026,7,31);
const LABEL = {A:"A", B:"B", C:"C", OFF:"휴"};
const DOW_KO = ["일","월","화","수","목","금","토"];

let activeTeam = "3조"; // 3조(나) 고정 — 다른 조 탭 제거됨
// 오늘 날짜 기준으로 월 설정
const TODAY = new Date();
let viewYear = TODAY.getFullYear(), viewMonth = TODAY.getMonth();
let darkMode = false;

// ===== 휴가/연장근무 데이터 (localStorage 저장) =====
// leaves: { "YYYY-MM-DD": {cat:"LEAVE"|"OT"|"EARLY", type:"ANNUAL", hours:8, memo:"..."} }
// quotas: 총보유 일수 (1일=8h 기준) — 교대케어(반기 2=연 4), 야간케어(반기 3=연 6)
const LV_NAME = {ANNUAL:"연차", YEAR:"연중", NIGHT:"야간케어", SHIFT:"교대케어", EX:"특근제외"};
const LV_COLOR = {ANNUAL:"#dc2626", YEAR:"#7c3aed", NIGHT:"#0ea5e9", SHIFT:"#16a34a", EX:"#64748b"};
const OT_COLOR = {OT:"#ea580c", EARLY:"#0d9488", EDU:"#9333ea"};
const OT_NAME = {OT:"연장(OT)", EARLY:"조출", EDU:"교육"};
const LV_KEYS = ["ANNUAL","YEAR","SHIFT","NIGHT"]; // 차감 대상 (EX 제외)
const LV_KEY = "shift_cal_leaves_v2"; // v2: cat 필드 추가
const Q_KEY = "shift_cal_quotas_v2"; // 불러올 때 v3 마이그레이션으로 SHIFT 통합
const THEME_KEY = "shift_cal_theme_v1"; // 주간/야간 모드 저장
const HOL_KEY = "shift_cal_userhol_v1"; // 사용자 추가 공휴일 (선거일 등 비정기)
let userHols = {}; // { "YYYY-MM-DD":{n:"이름",t:"hol"} }
let leaves = {};
let quotas = {}; // 현재 보고 있는 해(viewYear)의 보유량 — ensureQuotas()가 채움
const QUOTA_DEFAULT = {ANNUAL:15, YEAR:3, SHIFT:4, NIGHT:6}; // 교대케어 반기2=연4, 야간케어 반기3=연6
let quotaYears = {}; // 연도별 보유량: { "2026":{...}, "2027":{...} }
let filterType = "ALL"; // ALL 또는 특정 종류
let modalDate = null;

let modalCat = "LEAVE";

let modalEduhours = 2;

function loadData(){
  try{
    leaves = JSON.parse(localStorage.getItem(LV_KEY)||"{}");
    // 마이그레이션 v3: SHIFT_A/SHIFT_B → 통합 SHIFT
    for(const k in leaves){
      if(leaves[k].type==="SHIFT_A" || leaves[k].type==="SHIFT_B"){ leaves[k].type="SHIFT"; }
    }
  }catch(e){ leaves={}; }
  try{
    const q = JSON.parse(localStorage.getItem(Q_KEY)||"null");
    if(q){
      // 연도별 저장 구조(v4): { "2026":{...}, "2027":{...} }
      if(q.__years){
        quotaYears = q.__years;
      } else {
        // 기존 평탄 구조 마이그레이션 v4: 전체를 올해로 이관 + v3 통합(SHIFT_A+B→SHIFT)
        if(q.SHIFT_A!==undefined || q.SHIFT_B!==undefined){
          q.SHIFT = (q.SHIFT_A||0) + (q.SHIFT_B||0);
        }
        delete q.SHIFT_A; delete q.SHIFT_B;
        const y = new Date().getFullYear();
        quotaYears[y] = Object.assign({}, QUOTA_DEFAULT, q);
      }
    }
  }catch(e){}
}
function saveLeaves(){ localStorage.setItem(LV_KEY, JSON.stringify(leaves)); }
function saveQuotas(){ localStorage.setItem(Q_KEY, JSON.stringify({__years:quotaYears})); }
// 매년 새로 부여되는 종류는 기본값 리셋, 나머지는 이전 해 값 이어받기
const QUOTA_ANNUAL_RESET = ["ANNUAL","YEAR"]; // 연차·연중: 해마다 새 부여
// 2028년까지만 데이터 확정 — 이후 해의 연차·연중은 미부여(0)
const QUOTA_KNOWN_UNTIL = 2028;
// 해당 연도 보유량 확보: 없으면 생성 (연차·연중 리셋 / 교대·야간케어는 이전 해 이어받기)
function ensureQuotas(year){
  if(!quotaYears[year]){
    // 가장 가까운 과거 해의 값을 이어받음, 없으면 기본값
    const prevYears=Object.keys(quotaYears).map(Number).filter(y=>y<year).sort((a,b)=>b-a);
    quotaYears[year] = prevYears.length
      ? Object.assign({}, quotaYears[prevYears[0]])
      : Object.assign({}, QUOTA_DEFAULT);
    // 매년 새로 부여되는 종류(연차·연중)는 기본값으로 리셋
    for(const t of QUOTA_ANNUAL_RESET) quotaYears[year][t] = QUOTA_DEFAULT[t];
    // 2028년 이후는 확정 데이터 없음 — 연차·연중 미부여(0), 직접 입력해서 확정
    if(year > QUOTA_KNOWN_UNTIL){
      for(const t of QUOTA_ANNUAL_RESET) quotaYears[year][t] = 0;
    }
    saveQuotas();
  }
  quotas = quotaYears[year];
}

function pad(n){return n<10?"0"+n:""+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function daysBetween(a,b){return Math.round((b-a)/86400000);}

function shiftForTeam(team, date){
  const n = daysBetween(ANCHOR, date);
  const idx = ((TEAM_OFFSET[team] + n) % 24 + 24) % 24;
  return {shift:CYCLE[idx], day:CYCLE_DAY[idx]};
}
function isHoliday(date){return !!getHol(ymd(date));}
function isRest(team, date){
  const k=ymd(date);
  const s = shiftForTeam(team,date).shift;
  if(s==="OFF") return true;
  const lv=leaves[k];
  if(lv && (!lv.cat || lv.cat==="LEAVE")) return true; // 휴가만 쉬는 날 (OT/조출 제외)
  return false;
}

function fmtDate(d){return (d.getMonth()+1)+"월 "+d.getDate()+"일";}
// 시간(h) → "n일 n시간" 표시 (1일=8시간 기준): 10h → "1일 2시간", 8h → "1일", 2h → "2시간"
function fmtDays(hours){
  const d=Math.floor(hours/8), h=hours%8;
  if(d && h) return d+"일 "+h+"시간";
  if(d) return d+"일";
  return h+"시간";
}
// 보유량 입력 파싱: "15.3" → 15일+3시간 = 15.375일 (소수점 아래는 시간 그 자체, 8진 소수 아님)
function parseQuotaInput(str){
  const s=String(str).trim();
  const m=s.match(/^(\d*)(?:\.(\d+))?$/);
  if(!m) return parseFloat(s)||0;
  const d=m[1]?parseInt(m[1]):0;
  const h=m[2]?parseInt(m[2]):0; // 소수점 아래 자릿수 = 시간
  return d + h/8; // 일 단위로 환산 (내부 저장)
}
// 보유량(일) → 입력칸 표기: 15.375일 → "15.3" (소수점 아래 = 시간)
function fmtQuotaInput(days){
  const d=Math.floor(days);
  const h=Math.round((days-d)*8);
  if(h) return d+"."+h;
  return String(d);
}

// ===== 급여 기준월 패턴 =====
// 월급 25일 — 근무 기준월은 "그 달 15일 당일 또는 직전 일요일"에 마감, 다음 기간은 월요일 시작
// 예) 2026년 11월분: 10/12(월)~11/15(일) · 12월분: 11/16(월)~12/13(일)
function payPeriodEnd(year, month){ // month: 1~12
  const d=new Date(year, month-1, 15);
  d.setDate(d.getDate()-d.getDay()); // 당일 포함 가장 가까운 지난 일요일
  return d;
}
// 연차 근무연도 Y: 이전 해 12월 마감 다음날 ~ Y년 12월 마감
// (연중·교대케어·야간케어는 1/1~12/31 달력연도 그대로)
function leaveYearStart(y){ const d=payPeriodEnd(y-1,12); d.setDate(d.getDate()+1); return d; }
function leaveYearEnd(y){ return payPeriodEnd(y,12); }
// 날짜가 속한 연차 근무연도 — 12월 마감 이후면 다음 해
function leaveYearOf(dateStr){
  const d=new Date(dateStr);
  return d>leaveYearEnd(d.getFullYear()) ? d.getFullYear()+1 : d.getFullYear();
}
// 실제 급여일: 25일이 토·일·공휴일이면 앞 평일로 당김 (주말 → 직전 평일, 공휴일 겹치면 계속 당김)
function payDay(year, month){ // month: 1~12, 실제 지급 기준월
  const d=new Date(year, month-1, 25);
  while(d.getDay()===0 || d.getDay()===6 || getHol(ymd(d))){
    d.setDate(d.getDate()-1);
  }
  return d;
}

// ISO 8601 주차: 월~일이 한 주, 그 주의 목요일이 속한 해의 몇 번째 주인지
function isoWeek(d){
  const t=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7)); // 그 주의 목요일
  const week1=new Date(t.getFullYear(),0,4); // 해당 목요일 해의 1월 1일
  week1.setDate(week1.getDate()+3-((week1.getDay()+6)%7)); // 1주차의 목요일
  return {year:t.getFullYear(), week:1+Math.round((t-week1)/604800000)};
}

function renderGrid(){
  const first=new Date(viewYear,viewMonth,1);
  const lastDate=new Date(viewYear,viewMonth+1,0).getDate();
  let html='<tr><th class="wk-h"></th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th class="sat">토</th><th class="sun">일</th></tr><tr>';
  // 이전 달 날짜 (희미하게) — 첫째 주 월요일까지
  // JS getDay(): 일=0 … 토=6 → 월요일 시작 오프셋 = (getDay()+6)%7
  const startOff=(first.getDay()+6)%7;
  const prevMonth=new Date(viewYear,viewMonth,0); // 이전 달 마지막 날
  const prevLast=prevMonth.getDate();
  for(let i=startOff-1;i>=0;i--){
    const date=new Date(viewYear,viewMonth-1,prevLast-i);
    html+=renderCell(date,true);
  }
  for(let d=1; d<=lastDate; d++){
    const date=new Date(viewYear,viewMonth,d);
    html+=renderCell(date,false);
    if(date.getDay()===0 && d!==lastDate) html+='</tr><tr>'; // 일요일 = 행 끝
  }
  // 다음 달 날짜 (희미하게) — 그 주의 일요일까지
  const lastOff=((new Date(viewYear,viewMonth,lastDate).getDay())+6)%7; // 마지막 날의 월시작 오프셋
  let nd=1;
  for(let i=lastOff+1;i<7;i++){
    const date=new Date(viewYear,viewMonth+1,nd++);
    html+=renderCell(date,true);
  }
  html+='</tr>';
  document.getElementById("grid").innerHTML=html;
  // 각 주 행 왼쪽에 주차 표시 (ISO 기준)
  const rows=document.querySelectorAll("#grid tr");
  for(let r=1; r<rows.length; r++){
    const firstTd=rows[r].querySelector("td[data-d]");
    if(!firstTd) continue;
    const wkInfo=isoWeek(new Date(firstTd.dataset.d));
    const wk=document.createElement("td");
    wk.className="wk";
    wk.textContent=wkInfo.week;
    wk.title=wkInfo.year+"년 "+wkInfo.week+"주차 (월~일)";
    rows[r].insertBefore(wk, firstTd);
  }
  drawGroupBoxes();
}

// 연속 휴무/휴가 구간을 큰 박스로 묶어 표시 (이전/다음달로 이어지는 구간도 하나의 박스)
function drawGroupBoxes(){
  const grid=document.getElementById("grid");
  // 기존 오버레이 제거
  grid.querySelectorAll(".group-box").forEach(b=>b.remove());
  const tdEls=[...grid.querySelectorAll("td[data-d]")];
  if(!tdEls.length) return;
  function isRestDay(dStr){
    const d=new Date(dStr);
    const s=shiftForTeam(activeTeam,d).shift;
    if(s==="OFF") return true;
    const lv=leaves[dStr];
    if(lv && (!lv.cat || lv.cat==="LEAVE")) return true; // 휴가만 쉬는 날 (OT/조출 제외)
    return false;
  }
  function isLeaveDay(dStr){
    const lv=leaves[dStr];
    return !!lv && (!lv.cat || lv.cat==="LEAVE");
  }
  // 연속 그룹 추출 — DOM 순서 = 날짜 순서, 행이 바뀌어도(월이 바뀌어도) 하나의 논리 그룹
  const groups=[];
  let cur=[];
  function flush(){
    if(!cur.length) return;
    // 그룹 성립: 2일 이상 연속이거나, 휴가가 포함된 구간 (휴가 1일도 박스)
    if(cur.length>=2 || cur.some(c=>isLeaveDay(c.key))) groups.push(cur.slice());
    cur=[];
  }
  for(let i=0;i<tdEls.length;i++){
    const k=tdEls[i].dataset.d;
    if(isRestDay(k)){
      cur.push({key:k, td:tdEls[i], row:tdEls[i].offsetTop, other:tdEls[i].classList.contains("other")});
    } else flush();
  }
  flush();
  const gr=grid.getBoundingClientRect();
  for(const g of groups){
    // 현재 달 셀이 하나도 없는 그룹(전부 타월 희미 칸)은 그리지 않음
    if(g.every(c=>c.other)) continue;
    // 행별 세그먼트 분할 (offsetTop 기준 — 줄바꿈 시 자연스럽게 연결)
    const rows=[];
    let seg=[];
    for(let i=0;i<g.length;i++){
      if(seg.length && seg[seg.length-1].row!==g[i].row){
        rows.push(seg); seg=[];
      }
      seg.push(g[i]);
    }
    if(seg.length) rows.push(seg);
    // 각 행 세그먼트마다 박스 — 셀 테두리에 딱 맞는 크기 (오늘 표시 파란 박스와 동일 기준)
    const inset=1;
    for(const rseg of rows){
      const first=rseg[0].td, last=rseg[rseg.length-1].td;
      const fr=first.getBoundingClientRect(), lr=last.getBoundingClientRect();
      const box=document.createElement("div");
      box.className="group-box";
      // 셀 테두리 안쪽에 정확히 맞춤 (±확장 없음 — 오른쪽/왼쪽 넘침 및 글자 덮침 방지)
      // border-collapse로 인해 첫/끝 셀의 경계는 테두리 중심선이므로 안쪽 1px 여유
      const boxLeft=Math.max(0, fr.left-gr.left+1);
      const boxRight=Math.min(gr.width, lr.right-gr.left-1);
      const boxTop=Math.max(0, fr.top-gr.top+inset);
      const boxBottom=Math.min(gr.height, lr.bottom-gr.top-inset);
      box.style.left=boxLeft+"px";
      box.style.top=boxTop+"px";
      box.style.width=(boxRight-boxLeft)+"px";
      box.style.height=(boxBottom-boxTop)+"px";
      box.style.borderRadius="8px";
      grid.appendChild(box);
    }
  }
}

// 일자 칸 높이: 화면 높이 기준 고정 배분 (휴가/교육 추가·리스트 변동에 영향받지 않음)
function fitCellHeight(){
  const grid=document.getElementById("grid");
  if(!grid) return;
  const weeks=grid.querySelectorAll("tr").length - 1; // 요일 tr 제외
  if(weeks<1) return;
  const card=grid.closest(".month-card");
  const head=card.querySelector(".cal-head").offsetHeight;
  const thRow=grid.querySelector("th").offsetHeight;
  // 모바일(768px 이하): 최소 셀높이 낮추고 상단 예약분도 작게 — 한 화면에 달력 들어오게
  const isMobile = window.matchMedia("(max-width:768px)").matches;
  const minCell = isMobile ? 56 : 80;
  // 화면에서 캘린더에 쓸 수 있는 세로: 뷰포트 - 상단(툴바/보유량/카드패딩/너비 여유)
  const reserved = isMobile ? 230 : 150; // 모바일: 보유량 1열로 높이 커짐 + 툴바
  const avail = Math.max(weeks*minCell, window.innerHeight - head - thRow - 16 - reserved);
  const cellH=Math.max(minCell, Math.floor(avail / weeks));
  document.documentElement.style.setProperty("--cell-h", cellH+"px");
  // 우측 패널이 캘린더보다 길어지면 캘린더 높이에 맞춰 내부 스크롤
  const sideCol=document.querySelector(".cal-wrap > div:last-child");
  const calH=card.offsetHeight;
  if(sideCol && sideCol.offsetHeight > calH){
    sideCol.style.maxHeight=calH+"px";
    sideCol.style.overflowY="auto";
  } else if(sideCol){
    sideCol.style.maxHeight="";
    sideCol.style.overflowY="";
  }
}

function renderCell(date, other){
  const dow=date.getDay();
  const key=ymd(date);
  const hol=getHol(key);
  const s=shiftForTeam(activeTeam,date);
  const lv=leaves[key];
  const isLeave = lv && (!lv.cat || lv.cat==="LEAVE");
  const isOT = lv && (lv.cat==="OT"||lv.cat==="EARLY"||lv.cat==="EDU");
  // 필터: 휴가 종류 또는 OT/EARLY
  const showLv = isLeave && (filterType==="ALL" || lv.type===filterType);
  const showOT = isOT && (filterType==="ALL" || lv.cat===filterType);
  const anyShow = showLv || showOT;
  const dcls=(dow===0?" sun":dow===6?" sat":"");
  const isOff = s.shift==="OFF";
  // 특근제외(EX)도 일반 휴가와 동일 취급 — 점선(excl) 없음, 빨간 연속 상자에 포함
  const cellCls=(hol?"hol-cell ":"")+(isOff?"off-cell ":"")+(anyShow?"has-leave ":"")+(other?"other ":"")+(key===ymd(TODAY)?"today":"");
  const lvColor = isLeave ? LV_COLOR[lv.type] : (isOT ? OT_COLOR[lv.cat] : null);
  // 일차 → A-1 형식 (휴무는 휴-1)
  const shiftShort = s.shift==="OFF"?"휴":s.shift;
  const dayNum = s.day.replace("일차","");
  const dayLabel = shiftShort+"-"+dayNum;
  let html='<td'+(cellCls?' class="'+cellCls.trim()+'"':'')+' data-d="'+key+'"'+(anyShow&&lvColor?' style="--lv-color:'+lvColor+'"':'')+'>';
  // 셀 내용 전체를 절대배치 래퍼에 담음 → 콘텐츠가 많아도 셀 높이 계산에 영향 없음 (캘린더 늘어남 방지)
  html+='<div class="cell-inner">';
  // 대체공휴일: 일자를 일요일처럼 빨간색으로
  const altDateCls = (hol&&hol.t==="alt") ? " sun" : dcls;
  html+='<div class="date-row"><span class="date'+altDateCls+'">'+date.getDate()+'</span>';
  html+='<span class="shift-dot '+s.shift+'" title="'+s.shift+' '+s.day+'">'+dayLabel+'</span>';
  html+='</div>';
  if(hol) html+='<div class="cell-badge hol'+(hol.t==="alt"?" alt":"")+'">'+hol.n+'</div>';
  // 급여 기준월 경계 표시: 마감(회색)/시작(파랑) — 어느 해든 자동 계산
  {
    const y=date.getFullYear(), m=date.getMonth()+1;
    // 이 날짜가 속한 기준월: 15일 이후면 다음 달 기준 (예: 11/16~12/13은 12월분)
    const pm = date > payPeriodEnd(y, m) ? (m===12?1:m+1) : m;
    const py = date > payPeriodEnd(y, m) ? (m===12?y+1:y) : y;
    if(key===ymd(payPeriodEnd(y, m))){
      html+='<span class="cell-badge pay-mark end" title="급여 마감 — 다음 기간은 내일(월)부터">'+pm+'월분 마감</span>';
    }
    // 시작일 = 전 기준월 마감 다음날
    const startD=new Date(payPeriodEnd(py, pm===1?12:pm-1));
    startD.setDate(startD.getDate()+1);
    if(key===ymd(startD)){
      html+='<span class="cell-badge pay-mark" title="급여 기준 기간 시작">'+pm+'월분 시작</span>';
    }
    // 급여일: 원래 25일이 휴일이면 앞 평일로 당겨짐 (주말·공휴일 포함 계산)
    if(key===ymd(payDay(y, m))){
      const orig=new Date(y, m-1, 25);
      const pulled = orig.getTime()!==payDay(y,m).getTime();
      const tt = pulled
        ? '원래 25일('+DOW_KO[orig.getDay()]+')은 휴일 — 앞 평일로 당겨 지급'
        : '월급 지급일';
      html+='<span class="cell-badge pay-mark pay" title="'+tt+'">💰 급여</span>';
    }
  }
  // 연차 근무연도 마감 표시: 그 해 연차를 끝까지 쓸 수 있는 마지막 날 (다음날부터 다음 해 연차 차감)
  if(key===ymd(leaveYearEnd(date.getFullYear()))){
    html+='<div class="cell-badge ann-end" title="연차 마감일 — 내일부터 '+(date.getFullYear()+1)+'년 연차 차감">연차 마감</div>';
  }
  if(showLv){
    // 1일(8h)은 시간 표시 없이 종류명만, 시간 단위(1/2/4h)만 표시
    const hStr = lv.hours>=8 ? "" : lv.hours+"h";
    html+='<span class="cell-badge lv-mark '+lv.type+'">'+LV_NAME[lv.type]+(hStr?" "+hStr:"")+'</span>';
    if(lv.memo) html+='<div class="lv-memo" title="'+esc(lv.memo)+'">'+esc(lv.memo)+'</div>';
  } else if(showOT){
    const otHStr = lv.hours>=8 ? "" : lv.hours+"h";
    html+='<span class="cell-badge lv-mark ot-mark '+lv.cat+'">'+OT_NAME[lv.cat]+(otHStr?" "+otHStr:"")+'</span>';
    if(lv.memo) html+='<div class="lv-memo" title="'+esc(lv.memo)+'">'+esc(lv.memo)+'</div>';
  }
  html+='</div>';
  html+='</td>';
  return html;
}
function esc(s){return (s||"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}

function usedHours(type){
  let t=0;
  if(type==="ANNUAL"){
    // 연차는 급여 기준월을 따름: 12월 마감 이후 날짜는 다음 해 연차에서 차감
    const yStart=leaveYearStart(viewYear), yEnd=leaveYearEnd(viewYear);
    const sTime=yStart.getTime(), eTime=yEnd.getTime();
    for(const k in leaves){
      if(leaves[k].type!=="ANNUAL") continue;
      const dTime=new Date(k).getTime();
      if(dTime>=sTime && dTime<=eTime) t+=leaves[k].hours;
    }
  } else {
    // 연중·교대케어·야간케어는 1/1~12/31 달력연도
    const yPrefix=viewYear+"-";
    for(const k in leaves){ if(k.startsWith(yPrefix) && leaves[k].type===type) t+=leaves[k].hours; }
  }
  return t;
}
function otHours(cat){
  let t=0;
  const yPrefix=viewYear+"-";
  for(const k in leaves){ if(k.startsWith(yPrefix) && leaves[k].cat===cat) t+=leaves[k].hours; }
  return t;
}

  html+='<div class="filter-row">';
  html+='<span class="fchip '+(filterType==="ALL"?"on":"")+'" data-f="ALL">전체</span>';

  }
  html+='<span class="fchip '+(filterType==="OT"?"on":"")+'" data-f="OT">연장</span>';
  html+='<span class="fchip '+(filterType==="EARLY"?"on":"")+'" data-f="EARLY">조출</span>';
  html+='<span class="fchip '+(filterType==="EDU"?"on":"")+'" data-f="EDU">교육</span>';
  html+='</div>';
  const side=document.getElementById("side");
  side.innerHTML=html;
  // 필터 바인딩
  side.querySelectorAll(".fchip[data-f]").forEach(c=>{
    c.onclick=()=>{ filterType=c.dataset.f; render(); };
  });
}

// ===== 캘린더 위 보유량 블록 =====
function renderQuotas(){
  const grid=document.getElementById("quotaGrid");
  // 연차는 급여 기준월을 따름: 화면의 달이 12월 마감(12/13 등) 이후면 다음 해 연차로 표시
  const viewMid=new Date(viewYear, viewMonth, 15);
  const annualYear = viewMid > leaveYearEnd(viewYear) ? viewYear+1 : viewYear;
  ensureQuotas(annualYear); // 다음 해 연차 보유량 확보 (없을 때 생성)
  const annualQuota = quotaYears[annualYear].ANNUAL;
  let html='';
  for(const t of LV_KEYS){
    const used=usedHours(t);
    const totH=(t==="ANNUAL"?annualQuota:quotas[t])*8;
    const rem=totH-used;
    const remPct=totH>0?Math.round(rem/totH*100):100;
    // 잔여 적으면 색상 경고 (10% 이하 빨강, 30% 이하 주황)
    const remCls = remPct<=10 ? 'low' : (remPct<=30 ? 'mid' : '');
    const remTxt = fmtDays(rem);
    // 연차 항목에는 근무연도 표시 (예: 연차 '27)
    const nm = t==="ANNUAL" ? LV_NAME[t]+"'"+String(annualYear).slice(2) : LV_NAME[t];
    // 한 줄 카드: [종류] 보유(입력) · 사용 n일 n시간 · 잔여 n일 n시간
    html+='<div class="q-item" style="--qc:'+LV_COLOR[t]+'">';
    html+='<span class="q-nm" style="color:'+LV_COLOR[t]+'">'+nm+'</span>';
    html+='<input class="q-total" data-q="'+t+'" data-year="'+(t==="ANNUAL"?annualYear:viewYear)+'" value="'+fmtQuotaInput(t==="ANNUAL"?annualQuota:quotas[t])+'" title="일.시간 형식 입력 (예: 15.3 = 15일 3시간)">';
    html+='<span class="q-nums">보유 <b>'+fmtDays(totH)+'</b> · 사용 <span class="u">'+fmtDays(used)+'</span> · 잔여 <b class="'+remCls+'">'+remTxt+'</b>';
    html+='</div>';
  }
  grid.innerHTML=html;
  // 보유 일수 입력 바인딩 — 연차는 근무연도 저장, 나머지는 화면 연도 저장
  grid.querySelectorAll(".q-total").forEach(inp=>{
    inp.onchange=()=>{
      let v=parseQuotaInput(inp.value);
      if(v<0) v=0;
      quotaYears[inp.dataset.year][inp.dataset.q]=v;
      saveQuotas(); render();
    };
  });
  // 전체 요약
  let totUsed=0,totTot=0;
  for(const t of LV_KEYS){ totUsed+=usedHours(t); totTot+=(t==="ANNUAL"?annualQuota:quotas[t])*8; }
  const sumEl=document.getElementById("quotaSum");
  let sum='<b style="color:var(--ink)">'+viewYear+'년</b> 전체 보유 <b>'+fmtDays(totTot)+'</b> · 사용 <b>'+fmtDays(totUsed)+'</b> · 잔여 <b>'+fmtDays(totTot-totUsed)+'</b>';
  const otH=otHours("OT"), earlyH=otHours("EARLY"), eduH=otHours("EDU");
  let otPart='';
  if(otH>0) otPart+=' 연장 '+otH+'h';
  if(earlyH>0) otPart+=' 조출 '+earlyH+'h';
  if(eduH>0) otPart+=' 교육 '+eduH+'h';
  if(otPart) sum+='　·　<span style="color:#ea580c">'+otPart.trim()+'</span>';
  sumEl.innerHTML=sum;
}

// ===== 예정 휴가 리스트 (다가오는 날짜순) =====
function renderUpcoming(){
  const el=document.getElementById("upcomingList");
  if(!el) return;
  const todayKey=ymd(TODAY);
  const todayTime=new Date(todayKey).getTime(); // 오늘 00:00 기준
  const rows=[];
  for(const k in leaves){
    const lv=leaves[k];
    if(!lv.cat || lv.cat==="LEAVE" || lv.cat==="EDU"){
      const dTime=new Date(k).getTime();
      if(dTime>=todayTime) rows.push({key:k, lv});
    }
  }
  rows.sort((a,b)=>a.key<b.key?-1:1);
  let html='';
  if(!rows.length){
    html='<div class="none">예정된 휴가가 없습니다. 캘린더에서 날짜를 클릭해 입력하세요.</div>';
  } else {
    for(const r of rows){
      const d=new Date(r.key);
      const dd=Math.round((new Date(r.key).getTime()-todayTime)/86400000);
      // 1일(8h)은 시간 표시 없이 종류명만
      const hStr=r.lv.hours>=8 ? "" : r.lv.hours+"h";
      const ddayCls=dd<=3?"soon":"far";
      const ddayTxt=dd===0?"오늘":(dd===1?"내일":"D-"+dd);
      // 휴가(LEAVE)는 type 기준, 교육(EDU)은 cat 기준 색상/이름
      const isEdu = r.lv.cat==="EDU";
      const tagColor = isEdu ? OT_COLOR.EDU : LV_COLOR[r.lv.type];
      const tagName = isEdu ? "교육" : LV_NAME[r.lv.type];
      html+='<div class="up-row" data-goto="'+r.key+'" style="cursor:pointer" title="클릭하면 해당 월로 이동">';
      html+='<span class="up-date">'+fmtDate(d)+'</span>';
      html+='<span class="up-d">('+DOW_KO[d.getDay()]+')</span>';
      html+='<span class="up-tag" style="background:'+tagColor+'">'+tagName+(hStr?" "+hStr:"")+'</span>';
      if(r.lv.memo) html+='<span class="up-memo">'+esc(r.lv.memo)+'</span>';
      html+='<span class="up-dday '+ddayCls+'">'+ddayTxt+'</span>';
      html+='</div>';
    }
  }
  el.innerHTML=html;
  // 줄 클릭 → 해당 월로 이동
  el.querySelectorAll(".up-row[data-goto]").forEach(r=>{
    r.onclick=()=>{
      const p=r.dataset.goto.split("-");
      viewYear=parseInt(p[0]); viewMonth=parseInt(p[1])-1;
      render();
    };
  });
}

// ===== 모달 =====
function openModal(key){
  modalDate=key;
  const existing=leaves[key];
  const isHol=!!getHol(key);
  // 기존 데이터 카테고리 복원, 없으면 휴가
  modalCat = existing ? (existing.cat||"LEAVE") : "LEAVE";
  modalHours = existing && existing.cat==="LEAVE" ? existing.hours : 8;
  modalOThours = existing && (existing.cat==="OT"||existing.cat==="EARLY") ? existing.hours : 2;
  modalEduhours = existing && existing.cat==="EDU" ? existing.hours : 2;
  document.getElementById("mdate").textContent=key+" ("+activeTeam+")"+(isHol?" · 공휴일":"");
  setCat(modalCat);
  const sel=document.getElementById("lvType");
  // 특근제외(EX) 옵션은 공휴일인 날만 선택 가능
  const exOpt=sel.querySelector('option[value="EX"]');
  if(isHol){
    exOpt.disabled=false;
    exOpt.textContent="특근제외 (공휴일·휴가 차감 없음)";
  } else {
    exOpt.disabled=true;
    exOpt.textContent="특근제외 (공휴일에서만 사용 가능)";
  }
  // 교대케어: A·B조 근무일만 / 야간케어: C조 근무일만 사용 가능
  const dayShift = shiftForTeam(activeTeam, new Date(key)).shift;
  const optShift=sel.querySelector('option[value="SHIFT"]');
  const optNight=sel.querySelector('option[value="NIGHT"]');
  if(dayShift==="A" || dayShift==="B"){
    optShift.disabled=false; optShift.textContent="교대케어 ("+dayShift+"조 근무일)";
    optNight.disabled=true;  optNight.textContent="야간케어 — C조 근무일만";
  } else if(dayShift==="C"){
    optShift.disabled=true;  optShift.textContent="교대케어 — A·B조 근무일만";
    optNight.disabled=false; optNight.textContent="야간케어 (C조 근무일)";
  } else {
    // 휴무일 — 둘 다 사용 불가
    optShift.disabled=true; optShift.textContent="교대케어 — A·B조 근무일만";
    optNight.disabled=true;  optNight.textContent="야간케어 — C조 근무일만";
  }
  if(modalCat==="LEAVE"){
    let restoreType = existing&&existing.type ? existing.type : "ANNUAL";
    // 인터락 위반 값이면 기본값으로
    const lockedOpt = sel.querySelector('option[value="'+restoreType+'"]');
    if(restoreType==="EX" && !isHol) restoreType="ANNUAL";
    if(lockedOpt && lockedOpt.disabled) restoreType="ANNUAL";
    sel.value=restoreType;
  } else {
    sel.value="ANNUAL";
  }
  document.getElementById("lvMemo").value=existing?existing.memo||"":"";
  setHoursBtn(modalCat==="LEAVE"?modalHours:(modalCat==="EDU"?modalEduhours:modalOThours));
  document.getElementById("btnDel").style.display=existing?"block":"none";
  // 공휴일 추가 버튼: 내장 공휴일은 삭제 불가, 사용자 추가만 토글 가능
  const holBtn=document.getElementById("btnHol");
  const userHol=userHols[key];
  if(userHol){
    holBtn.textContent="🗑 사용자 공휴일 삭제 ("+userHol.n+")";
    holBtn.classList.add("on");
  } else {
    holBtn.textContent=HOLIDAYS[key] ? "📌 내장 공휴일 (고정)" : "🗳 이 날짜를 공휴일로 추가";
    holBtn.classList.remove("on");
    holBtn.disabled=!!HOLIDAYS[key]; // 내장 공휴일은 버튼 비활성
  }
  document.getElementById("modalBg").classList.add("show");
  setTimeout(()=>document.getElementById("lvMemo").focus(),50);
}
function setCat(c){
  modalCat=c;
  document.querySelectorAll("#lvCat button").forEach(b=>{
    b.classList.toggle("on", b.dataset.c===c);
  });
  document.getElementById("leaveFields").style.display = c==="LEAVE"?"block":"none";
  document.getElementById("otFields").style.display = c==="OT"||c==="EARLY"?"block":"none";
  document.getElementById("eduFields").style.display = c==="EDU"?"block":"none";
  document.getElementById("modalTitle").textContent =
    c==="LEAVE"?"휴가 입력":(c==="OT"?"연장근무 입력":(c==="EARLY"?"조출 입력":"교육 입력"));
  // 시간 버튼 갱신
  setHoursBtn(c==="LEAVE"?modalHours:(c==="EDU"?modalEduhours:modalOThours));
}
function closeModal(){ document.getElementById("modalBg").classList.remove("show"); modalDate=null; }
function setHoursBtn(h){
  const cont = modalCat==="LEAVE" ? "#lvHours" : (modalCat==="EDU" ? "#eduHours" : "#otHours");
  document.querySelectorAll(cont+" button").forEach(b=>{
    b.classList.toggle("on", parseInt(b.dataset.h)===h);
  });
}
function saveLeave(){
  if(!modalDate) return;
  const memo=document.getElementById("lvMemo").value.trim();
  if(modalCat==="LEAVE"){
    const sel=document.getElementById("lvType");
    const opt=sel.querySelector('option[value="'+sel.value+'"]');
    // 비활성화된 옵션(인터락/공휴일 제한)은 저장 차단
    if(opt && opt.disabled){ alert("이 날짜에 사용할 수 없는 휴가 종류입니다."); return; }
    // 연차는 급여 기준월 기준 근무연도에서 차감됨을 안내 (12월 마감 이후 = 다음 해 연차)
    leaves[modalDate]={cat:"LEAVE", type:sel.value, hours:modalHours, memo};
    if(sel.value==="ANNUAL"){
      const ly=leaveYearOf(modalDate);
      if(ly!==new Date(modalDate).getFullYear()){
        leaves[modalDate].ly=ly; // 차감되는 근무연도 기록
      }
    }
  } else {
    leaves[modalDate]={cat:modalCat, hours:modalCat==="EDU"?modalEduhours:modalOThours, memo};
  }
  saveLeaves(); closeModal(); render();
}
function delLeave(){
  if(modalDate && leaves[modalDate]){ delete leaves[modalDate]; saveLeaves(); }
  closeModal(); render();
}

function render(){
  document.getElementById("mlabel").textContent=viewYear+"년 "+(viewMonth+1)+"월";
  ensureQuotas(viewYear); // 보고 있는 해의 보유량 확보 (해마다 개별 저장)
  renderGrid(); renderSide(); renderQuotas(); renderUpcoming();
  fitCellHeight(); // 셀 높이를 패널에 맞춘 후
  drawGroupBoxes(); // 좌표 다시 계산
}

document.getElementById("prev").onclick=()=>{
  viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} render();
};
document.getElementById("next").onclick=()=>{
  viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} render();
};
// 연도 이동 — 같은 달 유지
document.getElementById("yprev").onclick=()=>{ viewYear--; render(); };
document.getElementById("ynext").onclick=()=>{ viewYear++; render(); };

// 캘린더 셀 클릭 → 모달 (이벤트 위임)
document.getElementById("grid").addEventListener("click", (e)=>{
  const td=e.target.closest("td[data-d]");
  if(!td) return;
  openModal(td.dataset.d);
});
// 모달 버튼
document.getElementById("btnSave").onclick=saveLeave;
document.getElementById("btnCancel").onclick=closeModal;
document.getElementById("btnDel").onclick=delLeave;
// 사용자 공휴일 토글 (선거일 등 비정기 공휴일)
document.getElementById("btnHol").onclick=()=>{
  if(!modalDate) return;
  if(userHols[modalDate]){
    if(!confirm(modalDate+" 공휴일 표시를 삭제할까요?")) return;
    delete userHols[modalDate];
  } else {
    if(HOLIDAYS[modalDate]) return; // 내장 공휴일 방어
    const name=prompt("공휴일 이름을 입력하세요 (예: 제21대 대통령선거)","임시 공휴일");
    if(name===null) return; // 취소
    userHols[modalDate]={n:name.trim()||"임시 공휴일", t:"hol"};
  }
  saveUserHols(); closeModal(); render();
};
document.getElementById("modalBg").addEventListener("click",(e)=>{
  if(e.target.id==="modalBg") closeModal();
});
document.querySelectorAll("#lvHours button").forEach(b=>{
  b.onclick=()=>{ modalHours=parseInt(b.dataset.h); setHoursBtn(modalHours); };
});
document.querySelectorAll("#otHours button").forEach(b=>{
  b.onclick=()=>{ modalOThours=parseInt(b.dataset.h); setHoursBtn(modalOThours); };
});
document.querySelectorAll("#eduHours button").forEach(b=>{
  b.onclick=()=>{ modalEduhours=parseInt(b.dataset.h); setHoursBtn(modalEduhours); };
});
document.querySelectorAll("#lvCat button").forEach(b=>{
  b.onclick=()=>{ setCat(b.dataset.c); };
});
// 메모에서 Enter 저장
document.getElementById("lvMemo").addEventListener("keydown",(e)=>{
  if(e.key==="Enter") saveLeave();
});
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape" && document.getElementById("modalBg").classList.contains("show")) closeModal();
});

loadData();
loadUserHols();
loadTheme();
render();

// ===== PWA 설정 — 단일 파일 유지: 아이콘·manifest 모두 canvas/data URI로 생성 =====
(function setupPWA(){
  // 아이콘: 진한 배경 + 캘린더 모양 (A/B/C 교대색 점 3개)
  function drawIcon(size){
    const c=document.createElement("canvas");
    c.width=c.height=size;
    const x=c.getContext("2d");
    // 배경 (야간 모드 색)
    x.fillStyle="#1a1d24";
    x.fillRect(0,0,size,size);
    // 상단 헤더 바
    const hTop=size*0.30;
    x.fillStyle="#374151";
    x.fillRect(size*0.12, size*0.14, size*0.76, hTop-size*0.14);
    // 헤더 좌우 고리
    x.fillStyle="#9ca3af";
    x.fillRect(size*0.26, size*0.08, size*0.06, size*0.10);
    x.fillRect(size*0.68, size*0.08, size*0.06, size*0.10);
    // 몸통 (밝은 카드색)
    x.fillStyle="#f4f6f9";
    x.fillRect(size*0.12, hTop, size*0.76, size*0.72);
    // A·B·C 교대색 점 3개 (큰 A 1개 + B·C 2개, 달력 날짜 모양)
    const dots=[["#e69100",.5,.47,.20],["#2b6cb0",.32,.68,.16],["#6b3fa0",.68,.68,.16]];
    for(const [col,cx,cy,rad] of dots){
      x.fillStyle=col;
      x.beginPath();
      x.arc(size*cx, size*cy, size*rad/2, 0, Math.PI*2);
      x.fill();
    }
    return c.toDataURL("image/png");
  }
  try{
    const icon192=drawIcon(192), icon512=drawIcon(512);
    // 파비콘 + iOS 홈 화면 아이콘
    document.getElementById("favicon").href=drawIcon(64);
    document.getElementById("appleTouchIcon").href=icon192;
    // manifest — data URI 아이콘 (단일 파일 제약)
    const manifest={
      name:"교대 캘린더 — 4조 3교대 휴가계획표",
      short_name:"교대캘린더",
      start_url:".",
      scope:".",
      display:"standalone",
      orientation:"any",
      background_color:"#1a1d24",
      theme_color:"#1a1d24",
      icons:[
        {src:icon192, sizes:"192x192", type:"image/png", purpose:"any"},
        {src:icon512, sizes:"512x512", type:"image/png", purpose:"any maskable"}
      ]
    };
    // manifest를 data URI로 — 단일 HTML 파일 제약 (별도 .json 파일 불가)
    document.getElementById("manifestLink").href=
      "data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(manifest));
  }catch(e){/* 캔버스 제한 환경 무시 */}
})();

// ===== 실시간 시계 =====
function tick(){
  const d=new Date();
  const p=n=>n<10?"0"+n:n;
  const days=["일","월","화","수","목","금","토"];
  const str=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"("+days[d.getDay()]+") "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  const el=document.getElementById("clock");
  if(el) el.textContent=str;
}
tick();
setInterval(tick,1000);
// 창 크기 변경 시 셀 높이/박스 재계산
window.addEventListener("resize", ()=>{ fitCellHeight(); drawGroupBoxes(); });

// ===== 데이터 백업·복구 (JSON) — 기기 이전·주소 변경 시 localStorage 이관용 =====
// 백업: 휴가(leaves) + 연도별 보유량(quotaYears) + 사용자 공휴일(userHols) + 테마
function exportData(){
  const data={
    app:"shift-calendar",
    version:2,
    exportedAt:new Date().toISOString(),
    leaves:leaves,
    quotas:{__years:quotaYears},
    userHols:userHols,
    theme:darkMode?"dark":"light"
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  // 파일명: 교대캘린더백업_2026-10-15.json
  const d=new Date();
  a.download="교대캘린더백업_"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
// 복구: 백업 파일 읽어 덮어쓰기 (기존 데이터 사라짐 — confirm으로 확인)
document.getElementById("importFile").addEventListener("change", function(){
  const f=this.files[0];
  this.value=""; // 같은 파일 재선택 가능하게
  if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data || data.app!=="shift-calendar" || !data.quotas || !data.quotas.__years){
        alert("이 파일은 교대 캘린더 백업 파일이 아닙니다.");
        return;
      }
      if(!confirm("현재 데이터를 백업 파일 내용으로 덮어씁니다.\n계속할까요?")) return;
      leaves=data.leaves||{};
      quotaYears=data.quotas.__years;
      userHols=data.userHols||{};
      localStorage.setItem(LV_KEY, JSON.stringify(leaves));
      saveQuotas();
      saveUserHols();
      if(data.theme==="dark" && !darkMode) toggleTheme();
      if(data.theme!=="dark" && darkMode) toggleTheme();
      render();
      alert("복구 완료했습니다.");
    }catch(e){
      alert("파일 읽기 실패: 올바른 백업 JSON 파일인지 확인하세요.");
    }
  };
  reader.readAsText(f);
});
</script>
